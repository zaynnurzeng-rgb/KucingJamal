name: Build Kucing Jamal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias jamal \
              -storepass kucingjamal123 \
              -keypass kucingjamal123 \
              -dname "CN=Kucing Jamal, OU=Dev, O=JamalApp, L=ID, ST=ID, C=ID"
            echo "RELEASE_STORE_PASSWORD=kucingjamal123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=jamal" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=kucingjamal123" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: KucingJamal-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish ke GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK_NAME="KucingJamal-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          COMMIT_MSG=$(git log -1 --pretty=%s)

          cat << NOTES > release_notes.md
          ### 🐱 Kucing Jamal ${TAG}

          **Perubahan terbaru:**
          - ${COMMIT_MSG}

          **Cara pasang:**
          Unduh file **\`${APK_NAME}\`** pada bagian *Assets* di bawah lalu instal langsung di HP Android (minimal Android 8.0).
          NOTES

          gh release create "$TAG" "$APK_NAME" \
            --title "Kucing Jamal ${TAG}" \
            --notes-file release_notes.md
